bundle:
  name: jira-analytics
  engine: direct

sync:
  include:
    - src/metrics/metric_views.sql
    - dashboards/jira_analytics.lvdash.json
    - src/genie/*.geniespace.json

variables:
  catalog:
    description: Unity Catalog for all layers (must exist)
  bronze_schema:
    description: Bronze schema for Lakeflow Connect landing
  silver_schema:
    description: Silver schema for normalized Jira ERD
  gold_schema:
    description: Gold schema for analytical marts
  metrics_schema:
    description: Metrics schema for Unity Catalog metric views
  jira_connection_name:
    description: Lakeflow Connect Jira connection name
  warehouse_id:
    description: SQL warehouse for dashboard, Genie, and jobs
  owner_email:
    description: Workspace user email (dashboard/Genie folder path)
  dashboard_name:
    description: Lakeview dashboard display name
  genie_space_name:
    description: Genie space title

include:
  - resources/common/*.yml
  - resources/full/*.yml # Updated by sync_config.sh

targets:
  dev:
    default: true
    mode: development
    run_as:
      user_name: ${var.owner_email}
    variables:
      catalog: ""
      bronze_schema: "jira_bronze"
      silver_schema: "jira_silver"
      gold_schema: "jira_gold"
      metrics_schema: "jira_metrics"
      jira_connection_name: ""
      warehouse_id: ""
      owner_email: ""
      dashboard_name: "Jira Analytics"
      genie_space_name: "Jira Analytics"

  prod:
    mode: production
    run_as:
      user_name: ${var.owner_email}
    variables:
      catalog: ""
      bronze_schema: "jira_bronze"
      silver_schema: "jira_silver"
      gold_schema: "jira_gold"
      metrics_schema: "jira_metrics"
      jira_connection_name: ""
      warehouse_id: ""
      owner_email: ""
