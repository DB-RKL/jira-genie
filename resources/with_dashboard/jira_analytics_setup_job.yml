resources:
  jobs:
    jira_analytics_setup:
      name: "jira-analytics-setup"
      tags:
        workload: jira-analytics
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.owner_email}
      tasks:
        # Ingestion (Lakeflow Connect) is decoupled and runs on its own schedule;
        # this job transforms bronze -> silver -> gold and refreshes metric views.
        - task_key: build_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.jira_silver_pipeline.id}
        - task_key: build_gold
          depends_on:
            - task_key: build_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.jira_gold_pipeline.id}
        - task_key: build_metrics
          depends_on:
            - task_key: build_gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ${workspace.file_path}/src/metrics/metric_views.sql
              source: WORKSPACE
