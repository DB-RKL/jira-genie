resources:
  pipelines:
    jira_gold_pipeline:
      name: jira_gold_pipeline
      catalog: ${var.catalog}
      target: ${var.gold_schema}
      channel: PREVIEW
      photon: true
      serverless: true
      development: true
      continuous: false
      libraries:
        - file:
            path: ../src/gold/dimensions.sql
        - file:
            path: ../src/gold/fct_issue.sql
        - file:
            path: ../src/gold/fct_issue_transitions.sql
        - file:
            path: ../src/gold/fct_sprint_velocity.sql
        - file:
            path: ../src/gold/fct_worklog.sql
        - file:
            path: ../src/gold/aggregates.sql
      configuration:
        silver_catalog: ${var.catalog}
        silver_schema: ${var.silver_schema}
