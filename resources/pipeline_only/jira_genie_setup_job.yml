resources:
  jobs:
    jira_genie_setup:
      name: "jira-genie-setup"
      tags:
        workload: jira-genie
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/London
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.owner_email}
      tasks:
        # Ingestion (Lakeflow Connect) is decoupled and runs on its own schedule;
        # this job transforms bronze -> silver -> gold.
        - task_key: build_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.jira_silver_pipeline.id}
        - task_key: build_gold
          depends_on:
            - task_key: build_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.jira_gold_pipeline.id}
