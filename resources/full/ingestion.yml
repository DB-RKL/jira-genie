resources:
  pipelines:
    jira_ingestion_pipeline:
      name: jira_ingestion_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      channel: PREVIEW
      photon: true
      serverless: true
      ingestion_definition:
        connection_name: ${var.jira_connection_name}
        objects:
          - table:
              source_schema: default
              source_table: issues
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_comments
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_field_values
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_fields
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_links
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_types
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_watchers
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: issue_worklogs
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: projects
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: project_board
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: project_categories
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: project_components
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
              source_table: project_permissions
              destination_catalog: ${var.catalog}
              destination_schema: ${resources.schemas.bronze.name}
          - table:
              source_schema: default
