name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Exposed from repo secrets so the bundle-validate step can gate on their
    # presence. The step is skipped (not failed) when they are unset — e.g. on
    # forks — so the rest of the checks still run.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Prepare test config
        run: |
          cp config/pipeline.example.yaml config/pipeline.yaml
          sed -i 's/catalog: ""/catalog: "test_catalog"/' config/pipeline.yaml
          sed -i 's/warehouse_id: ""/warehouse_id: "test_warehouse"/' config/pipeline.yaml
          sed -i 's/owner_email: ""/owner_email: "test@example.com"/' config/pipeline.yaml
          sed -i 's/jira_connection_name: ""/jira_connection_name: "test_jira"/' config/pipeline.yaml

      - name: Sync config and build assets
        run: ./scripts/sync_config.sh -t prod

      - name: Verify Python scripts compile
        run: python3 -m py_compile scripts/*.py src/silver/*.py src/gold/*.py src/metrics/metric_view_comments.py

      - name: Run unit tests
        run: python3 -m pytest tests/ -q

      - name: Validate bundle (requires DATABRICKS_HOST/DATABRICKS_TOKEN secrets)
        if: ${{ env.DATABRICKS_HOST != '' }}
        run: databricks bundle validate -t dev
